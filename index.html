<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>새벽 산사의 울림 | NAMU AHA</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  background: #17241f;
  overflow: hidden;
}

/* 전체 화면 */

.page {
  position: relative;
  width: 100%;
  height: 100svh;
  overflow: hidden;
  background: #17241f;
}

/* 우리가 확정한 디자인 이미지 */

.main-image {
  position: absolute;
  inset: 0;

  width: 100%;
  height: 100%;

  object-fit: cover;
  object-position: center center;

  user-select: none;
  -webkit-user-select: none;

  pointer-events: none;
}

/*
  실제 재생 버튼

  이미지에 그려져 있는
  '울림을 듣다' 원형 버튼 위에
  투명 버튼을 겹칩니다.
*/

.play-button {
  position: absolute;

  left: 50%;
  top: 58%;

  transform: translate(-50%, -50%);

  width: 120px;
  height: 120px;

  border: none;
  border-radius: 50%;

  background: transparent;

  cursor: pointer;

  -webkit-tap-highlight-color: transparent;
}

/* 누를 때 살짝 반응 */

.play-button:active {
  background: rgba(255,255,255,0.08);
}

/* 재생 중 은은한 파동 */

.play-button.playing::before,
.play-button.playing::after {

  content: "";

  position: absolute;

  inset: 7px;

  border-radius: 50%;

  border: 1px solid rgba(255,235,205,.55);

  animation: ripple 2.4s infinite;
}

.play-button.playing::after {
  animation-delay: 1.2s;
}

@keyframes ripple {

  0% {
    transform: scale(.85);
    opacity: .7;
  }

  100% {
    transform: scale(1.65);
    opacity: 0;
  }
}


/* 작은 휴대폰에서는 버튼 위치 미세 조정 */

@media (max-height: 700px) {

  .play-button {
    top: 56%;
    width: 105px;
    height: 105px;
  }

}

</style>
</head>


<body>

<div class="page">

  <!-- 확정한 메인 디자인 -->
  <img
    src="temple-main.png"
    class="main-image"
    alt="새벽 산사의 울림"
  >


  <!-- 이미지 위 실제 재생 버튼 -->
  <button
    id="playButton"
    class="play-button"
    aria-label="울림을 듣다"
  ></button>


  <!-- 종소리 -->
  <audio
    id="bellAudio"
    preload="auto"
  >
    <source
      src="bell_nfc_final.mp3"
      type="audio/mpeg"
    >
  </audio>

</div>


<script>

const audio =
  document.getElementById("bellAudio");

const button =
  document.getElementById("playButton");


/* 버튼 터치 */

button.addEventListener("click", async () => {

  if (audio.paused) {

    try {

      audio.currentTime = 0;

      await audio.play();

      button.classList.add("playing");

    } catch (error) {

      button.classList.remove("playing");

    }

  } else {

    audio.pause();

    button.classList.remove("playing");

  }

});


/* 종소리가 끝나면 파동 종료 */

audio.addEventListener("ended", () => {

  button.classList.remove("playing");

});


/*
  NFC로 페이지가 열렸을 때
  브라우저가 허용하면 자동재생을 시도합니다.

  자동재생이 차단되는 휴대폰에서는
  화면의 '울림을 듣다' 버튼을 누르면 됩니다.
*/

window.addEventListener("load", async () => {

  try {

    await audio.play();

    button.classList.add("playing");

  } catch (error) {

    /* 자동재생 차단 - 정상 */
  }

});

</script>

</body>
</html>
