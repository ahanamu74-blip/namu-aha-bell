<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>namu aha | 범종</title>

<style>
body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  background: #11100e;
  color: #eee8dc;
  font-family: Arial, sans-serif;
  text-align: center;
}

main {
  width: 90%;
  max-width: 460px;
}

.brand {
  font-size: 14px;
  letter-spacing: .22em;
  opacity: .6;
  margin-bottom: 55px;
}

.bell {
  font-size: 78px;
  margin-bottom: 25px;
}

h1 {
  font-size: 25px;
  font-weight: 500;
}

p {
  font-size: 14px;
  opacity: .6;
  margin-bottom: 35px;
}

button {
  width: 150px;
  height: 150px;
  border-radius: 50%;
  border: 1px solid #9d8a68;
  background: #1b1916;
  color: #eee8dc;
  font-size: 18px;
  cursor: pointer;
}

.note {
  margin-top: 30px;
  font-size: 12px;
  opacity: .4;
}
</style>
</head>

<body>

<main>

<div class="brand">NAMU AHA</div>

<div class="bell">🔔</div>

<h1>새벽 산사의 울림</h1>

<p>잠시 머물러, 깊은 울림을 들어보세요.</p>

<button id="play">
종을 울려보세요
</button>

<div class="note">
한 번 터치하면 범종 소리가 재생됩니다.
</div>

<audio id="audio" preload="metadata"
src="bell_nfc_final.mp3"></audio>

</main>

<script>
const audio = document.getElementById("audio");
const button = document.getElementById("play");

button.addEventListener("click", async function() {

  try {

    if (!audio.paused) {
      audio.pause();
      button.textContent = "다시 울리기";
      return;
    }

    audio.currentTime = 0;
    await audio.play();

    button.textContent = "울리는 중…";

  } catch(error) {

    button.textContent = "다시 눌러주세요";

  }

});

audio.addEventListener("ended", function() {
  button.textContent = "다시 울리기";
});
</script>

</body>
</html>
