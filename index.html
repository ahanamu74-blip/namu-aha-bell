<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>새벽 산사의 울림 | NAMU AHA</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  min-height:100%;
  font-family:"Noto Serif KR","Apple SD Gothic Neo",serif;
  background:#172421;
  color:#f7eee2;
}

body{
  overflow-x:hidden;
}

/* 전체 첫 화면 */
.hero{
  position:relative;
  width:100%;
  height:100svh;
  min-height:600px;
  overflow:hidden;

  background:
    radial-gradient(circle at 28% 19%,
      rgba(246,185,118,.95) 0%,
      rgba(197,126,81,.48) 14%,
      transparent 34%),

    linear-gradient(
      180deg,
      #283a35 0%,
      #45544b 26%,
      #708075 45%,
      #31453f 70%,
      #172421 100%
    );
}

/* 해 */
.sun{
  position:absolute;
  top:12%;
  left:19%;
  width:72px;
  height:72px;
  border-radius:50%;
  background:#ffe0a9;
  box-shadow:
    0 0 35px rgba(255,194,121,.85),
    0 0 90px rgba(255,161,87,.45);
}

/* 산 */
.mountain{
  position:absolute;
  left:-10%;
  width:120%;
  height:42%;
  border-radius:50% 50% 0 0;
  transform:rotate(-4deg);
}

.m1{
  bottom:39%;
  background:rgba(40,62,57,.48);
  clip-path:polygon(
    0 76%, 12% 60%, 25% 70%, 40% 37%,
    55% 65%, 70% 44%, 85% 63%, 100% 40%,
    100% 100%, 0 100%
  );
}

.m2{
  bottom:27%;
  background:rgba(28,50,45,.72);
  clip-path:polygon(
    0 72%, 16% 45%, 31% 65%, 47% 34%,
    61% 64%, 78% 40%, 100% 63%,
    100% 100%, 0 100%
  );
}

/* 안개 */
.mist{
  position:absolute;
  left:-10%;
  bottom:26%;
  width:120%;
  height:30%;
  background:
    linear-gradient(
      180deg,
      transparent,
      rgba(225,223,207,.22),
      rgba(235,230,215,.08),
      transparent
    );
  filter:blur(10px);
}

/* 절 처마 */
.temple{
  position:absolute;
  right:-18px;
  top:0;
  width:43%;
  height:64%;
  pointer-events:none;
}

.roof{
  position:absolute;
  top:4%;
  right:-10%;
  width:125%;
  height:20%;
  background:#17201d;
  clip-path:polygon(
    8% 25%,100% 0,100% 58%,82% 50%,
    63% 63%,42% 48%,20% 62%,0 42%
  );
  filter:drop-shadow(0 10px 12px rgba(0,0,0,.35));
}

.column{
  position:absolute;
  right:20%;
  top:18%;
  width:15px;
  height:58%;
  background:linear-gradient(90deg,#201813,#50392b,#201813);
}

/* 종 */
.bell{
  position:absolute;
  right:25%;
  top:29%;
  width:88px;
  height:118px;
  background:
    linear-gradient(
      90deg,
      #36271d,
      #866a48 28%,
      #a8895e 48%,
      #57412e 72%,
      #241b16
    );
  border-radius:45% 45% 17% 17%;
  box-shadow:
    inset 8px 0 18px rgba(255,220,150,.14),
    0 14px 25px rgba(0,0,0,.32);
}

.bell:before{
  content:"";
  position:absolute;
  top:-22px;
  left:34px;
  width:20px;
  height:30px;
  border-radius:8px;
  background:#5c4632;
}

.bell:after{
  content:"";
  position:absolute;
  bottom:-7px;
  left:-7px;
  width:102px;
  height:15px;
  border-radius:50%;
  background:#32241b;
}

/* 글과 버튼 */
.content{
  position:relative;
  z-index:10;
  height:100%;
  padding:
    max(28px, env(safe-area-inset-top))
    26px
    max(22px, env(safe-area-inset-bottom));

  display:flex;
  flex-direction:column;
}

.brand{
  font-size:18px;
  letter-spacing:5px;
  font-weight:700;
}

.brand-sub{
  margin-top:5px;
  font-size:10px;
  letter-spacing:3px;
  opacity:.75;
}

.copy{
  margin-top:14vh;
  max-width:72%;
}

.copy h1{
  margin:0 0 14px;
  font-size:clamp(27px,7vw,42px);
  line-height:1.2;
  font-weight:500;
  letter-spacing:-1px;
}

.copy p{
  margin:0;
  font-size:14px;
  line-height:1.9;
  color:rgba(255,245,232,.87);
  text-shadow:0 1px 5px rgba(0,0,0,.35);
}

/* 플레이 영역 */
.play-area{
  margin-top:auto;
  margin-bottom:9vh;
  display:flex;
  align-items:center;
  gap:16px;
}

.play-button{
  position:relative;
  width:92px;
  height:92px;
  flex:0 0 92px;
  border-radius:50%;
  border:1px solid rgba(255,236,210,.68);
  background:rgba(42,45,39,.34);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  color:#fff3e4;
  cursor:pointer;
  box-shadow:
    0 0 0 10px rgba(255,220,178,.04),
    0 10px 30px rgba(0,0,0,.25);
}

.play-button .icon{
  display:block;
  font-size:26px;
  line-height:1;
  margin-left:3px;
}

.play-button .label{
  display:block;
  margin-top:7px;
  font-size:10px;
  letter-spacing:1px;
}

.play-text{
  max-width:145px;
}

.play-text strong{
  display:block;
  font-size:14px;
  letter-spacing:1px;
  font-weight:500;
}

.play-text span{
  display:block;
  margin-top:6px;
  font-size:10px;
  line-height:1.5;
  opacity:.65;
}

/* 재생 중 파동 */
.play-button.playing:before,
.play-button.playing:after{
  content:"";
  position:absolute;
  inset:-1px;
  border:1px solid rgba(255,224,183,.55);
  border-radius:50%;
  animation:ripple 2.2s infinite;
}

.play-button.playing:after{
  animation-delay:1.1s;
}

@keyframes ripple{
  from{
    transform:scale(1);
    opacity:.65;
  }
  to{
    transform:scale(1.65);
    opacity:0;
  }
}

/* 하단 */
.footer{
  position:absolute;
  z-index:12;
  bottom:17px;
  left:26px;
  right:26px;
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  font-size:9px;
  letter-spacing:1.4px;
  color:rgba(255,242,225,.55);
}

@media(max-height:700px){
  .copy{
    margin-top:9vh;
  }

  .play-area{
    margin-bottom:7vh;
  }

  .copy h1{
    font-size:26px;
  }

  .play-button{
    width:82px;
    height:82px;
    flex-basis:82px;
  }
}
</style>
</head>

<body>

<section class="hero">

  <div class="sun"></div>
  <div class="mountain m1"></div>
  <div class="mountain m2"></div>
  <div class="mist"></div>

  <div class="temple">
    <div class="roof"></div>
    <div class="column"></div>
    <div class="bell"></div>
  </div>

  <div class="content">

    <div>
      <div class="brand">NAMU AHA</div>
      <div class="brand-sub">일상의 작은 울림</div>
    </div>

    <div class="copy">
      <h1>새벽 산사의 울림</h1>

      <p>
        잠시, 마음을 내려놓습니다.<br>
        깊은 울림이 지나간 자리에<br>
        고요가 머뭅니다.
      </p>
    </div>

    <div class="play-area">

      <button
        class="play-button"
        id="playButton"
        aria-label="종소리 재생"
      >
        <span class="icon" id="playIcon">▶</span>
        <span class="label" id="playLabel">울림을 듣다</span>
      </button>

      <div class="play-text">
        <strong>마음을 여는 한 번의 울림</strong>
        <span>
          버튼을 누르면<br>
          새벽 산사의 종소리가 시작됩니다.
        </span>
      </div>

    </div>

  </div>

  <div class="footer">
    <span>오늘도 평안하기를.</span>
    <span>A SMALL BELL · FOR A CALMER DAY</span>
  </div>

</section>

<audio id="bellAudio" preload="auto">
  <source src="bell_nfc_final.mp3" type="audio/mpeg">
</audio>

<script>
const audio = document.getElementById("bellAudio");
const button = document.getElementById("playButton");
const icon = document.getElementById("playIcon");
const label = document.getElementById("playLabel");

function playingUI(){
  button.classList.add("playing");
  icon.textContent = "Ⅱ";
  label.textContent = "울림 속에";
}

function stoppedUI(){
  button.classList.remove("playing");
  icon.textContent = "▶";
  label.textContent = "울림을 듣다";
}

button.addEventListener("click", async () => {

  if(audio.paused){
    try{
      await audio.play();
      playingUI();
    }catch(e){
      stoppedUI();
    }
  }else{
    audio.pause();
    stoppedUI();
  }

});

audio.addEventListener("ended", stoppedUI);
audio.addEventListener("pause", () => {
  if(!audio.ended) stoppedUI();
});

/* 브라우저가 허용하면 자동재생 시도 */
window.addEventListener("load", async () => {
  try{
    await audio.play();
    playingUI();
  }catch(e){
    /* 자동재생 차단 시 버튼으로 재생 */
  }
});
</script>

</body>
</html>
